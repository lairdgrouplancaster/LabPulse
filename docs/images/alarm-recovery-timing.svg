<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="394" viewBox="0 0 1000 394" role="img" aria-labelledby="title desc">
  <title id="title">Continuous recovery timing and reset</title>
  <desc id="desc">An active high alarm spends 50 seconds at 1.8 bar, then 30 seconds at 1.95 bar, which resets the timer. A further uninterrupted 120 seconds at 1.8 bar clears the alarm at 200 seconds.</desc>
  <rect width="1000" height="394" rx="12" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="38" font-size="26" text-anchor="start" fill="#192f40" font-weight="700">Recovery: one uninterrupted stay in the recovery zone</text>
<text x="40" y="69" font-size="18" text-anchor="start" fill="#506575" font-weight="400">High limit 2.0 bar · deadband 0.1 bar · required recovery 120 seconds</text>
<text x="80" y="111" font-size="18" text-anchor="start" fill="#192f40" font-weight="700">An alarm is already in Danger at 0 s.</text>
<rect x="80" y="137" width="210" height="68" rx="0" fill="#d9f2ee"/>
<text x="185" y="165" font-size="19" text-anchor="middle" fill="#192f40" font-weight="700">1.8 bar</text>
<text x="185" y="191" font-size="16" text-anchor="middle" fill="#192f40" font-weight="400">50 s in recovery zone</text>
<rect x="290" y="137" width="126" height="68" rx="0" fill="#fff0ca"/>
<text x="353" y="165" font-size="19" text-anchor="middle" fill="#192f40" font-weight="700">1.95 bar</text>
<text x="353" y="190" font-size="15" text-anchor="middle" fill="#192f40" font-weight="400">Buffer · 30 s</text>
<rect x="416" y="137" width="504" height="68" rx="0" fill="#d9f2ee"/>
<text x="668" y="165" font-size="19" text-anchor="middle" fill="#192f40" font-weight="700">1.8 bar</text>
<text x="668" y="191" font-size="16" text-anchor="middle" fill="#192f40" font-weight="400">120 s in recovery zone</text>
<line x1="80" y1="205" x2="80" y2="215" stroke="#192f40" stroke-width="2"/>
<text x="80" y="241" font-size="17" text-anchor="middle" fill="#192f40" font-weight="400">0 s</text>
<line x1="290" y1="205" x2="290" y2="215" stroke="#192f40" stroke-width="2"/>
<text x="290" y="241" font-size="17" text-anchor="middle" fill="#192f40" font-weight="400">50 s</text>
<line x1="416" y1="205" x2="416" y2="215" stroke="#192f40" stroke-width="2"/>
<text x="416" y="241" font-size="17" text-anchor="middle" fill="#192f40" font-weight="400">80 s</text>
<line x1="920" y1="205" x2="920" y2="215" stroke="#192f40" stroke-width="2"/>
<text x="920" y="241" font-size="17" text-anchor="middle" fill="#192f40" font-weight="400">200 s</text>
<line x1="290" y1="248" x2="290" y2="266" stroke="#506575" stroke-width="2"/>
<text x="290" y="287" font-size="17" text-anchor="middle" fill="#192f40" font-weight="700">Timer resets</text>
<line x1="416" y1="248" x2="416" y2="302" stroke="#506575" stroke-width="2"/>
<text x="416" y="325" font-size="17" text-anchor="middle" fill="#192f40" font-weight="700">Start again</text>
<line x1="920" y1="248" x2="920" y2="266" stroke="#506575" stroke-width="2"/>
<text x="920" y="287" font-size="18" text-anchor="middle" fill="#105949" font-weight="700">Normal</text>
<text x="500" y="366" font-size="18" text-anchor="middle" fill="#192f40" font-weight="400">The first 50 seconds do not carry over. Even the buffer interrupts recovery.</text>
  </g>
</svg>
